schema_version: release-exclusions/1
exclude:
  - .git/**
  - .cache/**
  - .pytest_cache/**
  - .venv/**
  - node_modules/**
  - input/**
  - output/**
  - staging/**
  - workspace/**
  - projects/**
  - archive/**
  - brief/**
  - audit/**
  - benchmark/**
  - private/**
  - cache/**
  - release/**
  - config/local.yaml
  - runtime_logs/**
  - install_receipts/**
  - docs/*.docx
  - "**/__pycache__/**"
  - "**/*.pyc"
  - "**/~$*"
include:
  - run_ppt_workflow.py
  - pyproject.toml
  - package.json
  - package-lock.json
  - requirements-lock.txt
  - README.md
  - README_中文使用说明.md
  - README_使用说明.md
  - README_FIRST_INSTALL.md
  - CHANGELOG.md
  - config/**
  - scripts/**
  - docs/**
  - design_system/**
  - visual_workspaces/**
  - visual_templates/**
  - extensions/**
  - prompts/**
  - templates/**
  - tests/**
  - regression/**
  - governance/**
  - skills/**
  - .github/**
  - privacy_allowlist.yaml
  - release_exclusion_rules.yaml
  - .gitignore
  - .gitattributes
